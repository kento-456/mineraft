<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Minecraft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 15px;
            font-size: 24px;
            letter-spacing: 1px;
            color: #c6c6c6;
            text-shadow: 2px 2px #000000;
        }
        .game-container {
            position: relative;
            width: 485px;
            height: 402px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 4px solid #4a4a4a;
            border-radius: 4px;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Paper Minecraft</h1>

    <div class="game-container">
        <!-- This embeds Griffpatch's official Paper Minecraft project from Scratch -->
        <iframe src="https://mit.edu" 
                allowtransparency="true" 
                allowfullscreen="true" 
                scrolling="no">
        </iframe>
    </div>

    <div class="controls-hint">
        Click the Green Flag inside the window to start playing!
    </div>

</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 2D Minecraft Engine</title>
    <!-- Link to your new style.css file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>2D Minecraft Engine</h1>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="480"></canvas>
    </div>
    
    <div id="ui">Selected Block: Dirt (Press 1: Dirt, 2: Stone, 3: Grass) | Left Click: Break | Right Click: Place</div>

    <script src="game.js"></script>
</body>
</html>
<iframe src="https://mit.edu" 
        allowtransparency="true" 
        allowfullscreen="true" 
        scrolling="no">
</iframe>
