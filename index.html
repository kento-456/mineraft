<script>

/* =====================================================

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const TILE = 32;

const WORLD_WIDTH = 180;
const WORLD_HEIGHT = 50;

const GRAVITY = 0.45;

const JUMP_POWER = -10;

const MOVE_SPEED = 4;

        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resize
);

/* =====================================================
   WORLD GENERATION
===================================================== */

function generateWorld() {

    world = [];

    for (
        let y = 0;
        y < WORLD_HEIGHT;
        y++
    ) {

        world[y] = [];

        for (
            let x = 0;
            x < WORLD_WIDTH;
            x++
        ) {

            world[y][x] = AIR;
        }
    }


    /* Ground */

    let groundHeights = [];

    let height = 28;


    for (
        let x = 0;
        x < WORLD_WIDTH;
        x++
    ) {

        height +=
            Math.floor(
                Math.random() * 3
            ) - 1;

        height =
            Math.max(
                20,
                Math.min(
                    31,
                    height
                )
            );

        groundHeights[x] =
            height;


        for (
            let y = height;
            y < WORLD_HEIGHT;
            y++
        ) {

            if (
                y === height
            ) {

                world[y][x] =
                    GRASS;

            } else if (
                y < height + 4
            ) {

                world[y][x] =
                    DIRT;

            } else {

                world[y][x] =
                    STONE;
            }
        }
    }


    /* Underground ores */

    for (
        let y = 35;
        y < WORLD_HEIGHT - 2;
        y++
    ) {

        for (
            let x = 0;
            x < WORLD_WIDTH;
            x++
        ) {

            if (
                world[y][x] !== STONE
            ) {
                continue;
            }


            if (
                Math.random() < 0.025
            ) {

                world[y][x] =
                    DIAMOND;

            } else if (
                Math.random() < 0.06
            ) {

                world[y][x] =
                    COAL;
            }
        }
    }


    /* Trees */

    for (
        let x = 5;
        x < WORLD_WIDTH - 5;
        x++
    ) {

        if (
            Math.random() < 0.06
        ) {

            createTree(
                x,
                groundHeights[x]
            );
        }
    }


    /* Bed */

    const bedX = 15;

    const bedY =
        groundHeights[bedX] - 1;

    world[bedY][bedX] =
        BED;


    /* Spawn area */

    const spawnX = 10;

    player.x =
        spawnX * TILE;

    player.y =
        (groundHeights[spawnX] - 3)
        * TILE;


    /* Animals */

    spawnAnimals();
}


/* =====================================================
   TREE
===================================================== */

function createTree(
    x,
    groundY
) {

    const trunkHeight = 4;


    for (
        let y = groundY - 1;
        y >= groundY - trunkHeight;
        y--
    ) {

        if (
            y >= 0
        ) {

            world[y][x] =
                WOOD;
        }
    }


    const top =
        groundY - trunkHeight;


    for (
        let y = top - 2;
        y <= top + 1;
        y++
    ) {

        for (
            let dx = -2;
            dx <= 2;
            dx++
        ) {

            if (
                Math.abs(dx) <= 1 ||
                y === top - 2
            ) {

                if (
                    x + dx >= 0 &&
                    x + dx < WORLD_WIDTH &&
                    y >= 0
                ) {

                    world[y][x + dx] =
                        LEAVES;
                }
            }
        }
    }
}


/* =====================================================
   ANIMALS
===================================================== */

function spawnAnimals() {

    animals = [];


    const types = [
        "cow",
        "cow",
        "sheep",
        "sheep",
        "chicken",
        "chicken",
        "pig"
    ];


    for (
        const type of types
    ) {

        const x =
            Math.floor(
                Math.random() *
                (WORLD_WIDTH - 20)
            ) + 10;


        const ground =
            findGround(x);


        animals.push({

            type: type,

            x: x * TILE,

            y:
                (ground - 1)
                * TILE,

            vx:
                Math.random() > .5
                ? 0.5
                : -0.5,

            vy: 0,

            health: 20,

            timer:
                Math.random() * 100

        });
    }
}


/* =====================================================
   FIND GROUND
===================================================== */

function findGround(x) {

    x =
        Math.floor(x);


    for (
        let y = 0;
        y < WORLD_HEIGHT;
        y++
    ) {

        if (
            world[y][x] !== AIR
        ) {

            return y;
        }
    }

    return 25;
}


/* =====================================================
   BLOCK SOLID
===================================================== */

function solidAt(
    tx,
    ty
) {

    if (
        tx < 0 ||
        tx >= WORLD_WIDTH ||
        ty < 0
    ) {

        return true;
    }


    if (
        ty >= WORLD_HEIGHT
    ) {

        return true;
    }


    return world[ty][tx] !== AIR;
}


/* =====================================================
   PLAYER COLLISION
===================================================== */

function collides(
    x,
    y
) {

    const left =
        Math.floor(
            x / TILE
        );

    const right =
        Math.floor(
            (x + player.width)
            / TILE
        );

    const top =
        Math.floor(
            y / TILE
        );

    const bottom =
        Math.floor(
            (y + player.height)
            / TILE
        );


    for (
        let ty = top;
        ty <= bottom;
        ty++
    ) {

        for (
            let tx = left;
            tx <= right;
            tx++
        ) {

            if (
                solidAt(tx, ty)
            ) {

                return true;
            }
        }
    }

    return false;
}


/* =====================================================
   PLAYER
===================================================== */

function updatePlayer() {

    if (
        player.sleeping
    ) {

        return;
    }


    /* Movement */

    player.vx = 0;


    if (
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ) {

        player.vx =
            -MOVE_SPEED;
    }


    if (
        keys["KeyD"] ||
        keys["ArrowRight"]
    ) {

        player.vx =
            MOVE_SPEED;
    }


    /* Jump */

    if (
        (
            keys["KeyW"] ||
            keys["Space"] ||
            keys["ArrowUp"]
        ) &&
        player.grounded
    ) {

        player.vy =
            JUMP_POWER;

        player.grounded =
            false;
    }


    /* Horizontal */

    player.x +=
        player.vx;


    if (
        collides(
            player.x,
            player.y
        )
    ) {

        while (
            collides(
                player.x,
                player.y
            )
        ) {

            player.x -=
                Math.sign(
                    player.vx
                );
        }
    }


    /* Gravity */

    player.vy +=
        GRAVITY;


    player.y +=
        player.vy;


    /* Vertical collision */

    if (
        collides(
            player.x,
            player.y
        )
    ) {

        if (
            player.vy > 0
        ) {

            while (
                collides(
                    player.x,
                    player.y
                )
            ) {

                player.y -= 1;
            }

            player.grounded =
                true;

        } else {

            while (
                collides(
                    player.x,
                    player.y
                )
            ) {

                player.y += 1;
            }
        }


        player.vy = 0;
    }


    /*
       Extra safety:
       player can NEVER fall below
       the bottom of the world.
    */

    const bottomLimit =
        (WORLD_HEIGHT - 2)
        * TILE;


    if (
        player.y >
        bottomLimit
    ) {

        player.y =
            bottomLimit;

        player.vy = 0;

        player.grounded =
            true;
    }


    /* Hunger */

    player.hunger -=
        0.01;


    if (
        player.hunger < 0
    ) {

        player.hunger = 0;
    }


    if (
        player.hunger === 0
    ) {

        player.health -=
            0.02;
    }


    if (
        player.health <= 0
    ) {

        respawn();
    }
}

            (ground - 1)
            * TILE;


        if (
            tx <= 1 ||
            tx >= WORLD_WIDTH - 2
        ) {

            animal.vx *= -1;
        }
    }
}
