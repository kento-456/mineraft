<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;


/* =====================================================
   SETTINGS
===================================================== */

const TILE = 32;

const WORLD_WIDTH = 180;
const WORLD_HEIGHT = 50;

const GRAVITY = 0.45;

const JUMP_POWER = -10;

const MOVE_SPEED = 4;


/* =====================================================
   BLOCKS
===================================================== */

const AIR = 0;
const GRASS = 1;
const DIRT = 2;
const STONE = 3;
const WOOD = 4;
const LEAVES = 5;
const DIAMOND = 6;
const COAL = 7;
const BED = 8;
const SAND = 9;


/* =====================================================
   WORLD
===================================================== */

let world = [];

let animals = [];

let particles = [];

let gameRunning = false;

let cameraX = 0;
let cameraY = 0;


/* =====================================================
   PLAYER
===================================================== */

const player = {

    x: 10,
    y: 5,

    width: 24,
    height: 44,

    vx: 0,
    vy: 0,

    grounded: false,

    health: 100,
    hunger: 100,

    diamonds: 0,
    apples: 3,
    meat: 0,

    sleeping: false

};


/* =====================================================
   INPUT
===================================================== */

const keys = {};

let selectedBlock = GRASS;

let mouseX = 0;
let mouseY = 0;


document.addEventListener(
    "keydown",
    e => {

        keys[e.code] = true;

        if (
            e.code === "Space"
        ) {
            e.preventDefault();
        }


        if (
            e.code === "KeyE"
        ) {
            eatFood();
        }


        if (
            e.code === "KeyF"
        ) {
            sleep();
        }


        if (
            e.key >= "1" &&
            e.key <= "6"
        ) {

            selectBlock(
                Number(e.key)
            );
        }
    }
);


document.addEventListener(
    "keyup",
    e => {

        keys[e.code] = false;
    }
);


/* =====================================================
   RESIZE
===================================================== */

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
   WORLD GENERATION
===================================================== */

function generateWorld() {

    world = [];

    for (
        let y = 0;
        y < WORLD_HEIGHT;
        y++
    ) {

        world[y] = [];

        for (
            let x = 0;
            x < WORLD_WIDTH;
            x++
        ) {

            world[y][x] = AIR;
        }
    }


    /* Ground */

    let groundHeights = [];

    let height = 28;


    for (
        let x = 0;
        x < WORLD_WIDTH;
        x++
    ) {

        height +=
            Math.floor(
                Math.random() * 3
            ) - 1;

        height =
            Math.max(
                20,
                Math.min(
                    31,
                    height
                )
            );

        groundHeights[x] =
            height;


        for (
            let y = height;
            y < WORLD_HEIGHT;
            y++
        ) {

            if (
                y === height
            ) {

                world[y][x] =
                    GRASS;

            } else if (
                y < height + 4
            ) {

                world[y][x] =
                    DIRT;

            } else {

                world[y][x] =
                    STONE;
            }
        }
    }


    /* Underground ores */

    for (
        let y = 35;
        y < WORLD_HEIGHT - 2;
        y++
    ) {

        for (
            let x = 0;
            x < WORLD_WIDTH;
            x++
        ) {

            if (
                world[y][x] !== STONE
            ) {
                continue;
            }


            if (
                Math.random() < 0.025
            ) {

                world[y][x] =
                    DIAMOND;

            } else if (
                Math.random() < 0.06
            ) {

                world[y][x] =
                    COAL;
            }
        }
    }


    /* Trees */

    for (
        let x = 5;
        x < WORLD_WIDTH - 5;
        x++
    ) {

        if (
            Math.random() < 0.06
        ) {

            createTree(
                x,
                groundHeights[x]
            );
        }
    }


    /* Bed */

    const bedX = 15;

    const bedY =
        groundHeights[bedX] - 1;

    world[bedY][bedX] =
        BED;


    /* Spawn area */

    const spawnX = 10;

    player.x =
        spawnX * TILE;

    player.y =
        (groundHeights[spawnX] - 3)
        * TILE;


    /* Animals */

    spawnAnimals();
}


/* =====================================================
   TREE
===================================================== */

function createTree(
    x,
    groundY
) {

    const trunkHeight = 4;


    for (
        let y = groundY - 1;
        y >= groundY - trunkHeight;
        y--
    ) {

        if (
            y >= 0
        ) {

            world[y][x] =
                WOOD;
        }
    }


    const top =
        groundY - trunkHeight;


    for (
        let y = top - 2;
        y <= top + 1;
        y++
    ) {

        for (
            let dx = -2;
            dx <= 2;
            dx++
        ) {

            if (
                Math.abs(dx) <= 1 ||
                y === top - 2
            ) {

                if (
                    x + dx >= 0 &&
                    x + dx < WORLD_WIDTH &&
                    y >= 0
                ) {

                    world[y][x + dx] =
                        LEAVES;
                }
            }
        }
    }
}


/* =====================================================
   ANIMALS
===================================================== */

function spawnAnimals() {

    animals = [];


    const types = [
        "cow",
        "cow",
        "sheep",
        "sheep",
        "chicken",
        "chicken",
        "pig"
    ];


    for (
        const type of types
    ) {

        const x =
            Math.floor(
                Math.random() *
                (WORLD_WIDTH - 20)
            ) + 10;


        const ground =
            findGround(x);


        animals.push({

            type: type,

            x: x * TILE,

            y:
                (ground - 1)
                * TILE,

            vx:
                Math.random() > .5
                ? 0.5
                : -0.5,

            vy: 0,

            health: 20,

            timer:
                Math.random() * 100

        });
    }
}


/* =====================================================
   FIND GROUND
===================================================== */

function findGround(x) {

    x =
        Math.floor(x);


    for (
        let y = 0;
        y < WORLD_HEIGHT;
        y++
    ) {

        if (
            world[y][x] !== AIR
        ) {

            return y;
        }
    }

    return 25;
}


/* =====================================================
   BLOCK SOLID
===================================================== */

function solidAt(
    tx,
    ty
) {

    if (
        tx < 0 ||
        tx >= WORLD_WIDTH ||
        ty < 0
    ) {

        return true;
    }


    if (
        ty >= WORLD_HEIGHT
    ) {

        return true;
    }


    return world[ty][tx] !== AIR;
}


/* =====================================================
   PLAYER COLLISION
===================================================== */

function collides(
    x,
    y
) {

    const left =
        Math.floor(
            x / TILE
        );

    const right =
        Math.floor(
            (x + player.width)
            / TILE
        );

    const top =
        Math.floor(
            y / TILE
        );

    const bottom =
        Math.floor(
            (y + player.height)
            / TILE
        );


    for (
        let ty = top;
        ty <= bottom;
        ty++
    ) {

        for (
            let tx = left;
            tx <= right;
            tx++
        ) {

            if (
                solidAt(tx, ty)
            ) {

                return true;
            }
        }
    }

    return false;
}


/* =====================================================
   PLAYER
===================================================== */

function updatePlayer() {

    if (
        player.sleeping
    ) {

        return;
    }


    /* Movement */

    player.vx = 0;


    if (
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ) {

        player.vx =
            -MOVE_SPEED;
    }


    if (
        keys["KeyD"] ||
        keys["ArrowRight"]
    ) {

        player.vx =
            MOVE_SPEED;
    }


    /* Jump */

    if (
        (
            keys["KeyW"] ||
            keys["Space"] ||
            keys["ArrowUp"]
        ) &&
        player.grounded
    ) {

        player.vy =
            JUMP_POWER;

        player.grounded =
            false;
    }


    /* Horizontal */

    player.x +=
        player.vx;


    if (
        collides(
            player.x,
            player.y
        )
    ) {

        while (
            collides(
                player.x,
                player.y
            )
        ) {

            player.x -=
                Math.sign(
                    player.vx
                );
        }
    }


    /* Gravity */

    player.vy +=
        GRAVITY;


    player.y +=
        player.vy;


    /* Vertical collision */

    if (
        collides(
            player.x,
            player.y
        )
    ) {

        if (
            player.vy > 0
        ) {

            while (
                collides(
                    player.x,
                    player.y
                )
            ) {

                player.y -= 1;
            }

            player.grounded =
                true;

        } else {

            while (
                collides(
                    player.x,
                    player.y
                )
            ) {

                player.y += 1;
            }
        }


        player.vy = 0;
    }


    /*
       Extra safety:
       player can NEVER fall below
       the bottom of the world.
    */

    const bottomLimit =
        (WORLD_HEIGHT - 2)
        * TILE;


    if (
        player.y >
        bottomLimit
    ) {

        player.y =
            bottomLimit;

        player.vy = 0;

        player.grounded =
            true;
    }


    /* Hunger */

    player.hunger -=
        0.01;


    if (
        player.hunger < 0
    ) {

        player.hunger = 0;
    }


    if (
        player.hunger === 0
    ) {

        player.health -=
            0.02;
    }


    if (
        player.health <= 0
    ) {

        respawn();
    }
}


/* =====================================================
   ANIMAL UPDATE
===================================================== */

function updateAnimals() {

    for (
        const animal of animals
    ) {

        animal.timer--;


        if (
            animal.timer <= 0
        ) {

            animal.timer =
                60 +
                Math.random() * 180;


            animal.vx =
                (
                    Math.random()
                    - 0.5
                ) * 1.5;
        }


        animal.x +=
            animal.vx;


        const tx =
            Math.floor(
                animal.x / TILE
            );


        const ground =
            findGround(tx);


        animal.y =
            (ground - 1)
            * TILE;


        if (
            tx <= 1 ||
            tx >= WORLD_WIDTH - 2
        ) {

            animal.vx *= -1;
        }
    }
}


/* =====================================================
   MOUSE
===================================================== */

canvas.addEventListener(
    "mousemove",
    e => {

        mouseX =
            e.clientX +
            cameraX;

        mouseY =
            e.clientY +
            cameraY;
    }
);


/* =====================================================
   MINE BLOCK
===================================================== */

canvas.addEventListener(
    "mousedown",
    e => {

        if (
            !gameRunning
        ) {
            return;
        }


        const tx =
            Math.floor(
                mouseX / TILE
            );

        const ty =
            Math.floor(
                mouseY / TILE
            );


        if (
            tx < 0 ||
            tx >= WORLD_WIDTH ||
            ty < 0 ||
            ty >= WORLD_HEIGHT
        ) {

            return;
        }


        /* LEFT CLICK = MINE */

        if (
            e.button === 0
        ) {

            mineBlock(
                tx,
                ty
            );
        }


        /* RIGHT CLICK = PLACE */

        if (
            e.button === 2
        ) {

            placeBlock(
                tx,
                ty
            );
        }
    }
);


/* Disable browser right-click */

canvas.addEventListener(
    "contextmenu",
    e => {

        e.preventDefault();
    }
);


/* =====================================================
   MINE
===================================================== */

function mineBlock(
    x,
    y
) {

    const block =
        world[y][x];


    if (
        block === AIR
    ) {

        return;
    }


    /* Diamond */

    if (
        block === DIAMOND
    ) {

        player.diamonds++;

        showMessage(
            "💎 Diamond found!"
        );
    }


    /* Leaves */

    if (
        block === LEAVES
    ) {

        if (
            Math.random() < 0.3
        ) {

            player.apples++;

            showMessage(
                "🍎 You found an apple!"
            );
        }
    }


    /* Wood */

    if (
        block === WOOD
    ) {

        showMessage(
            "🪵 Wood collected!"
        );
    }


    world[y][x] =
        AIR;
}


/* =====================================================
   PLACE BLOCK
===================================================== */

function placeBlock(
    x,
    y
) {

    if (
        world[y][x] !== AIR
    ) {

        return;
    }


    /*
       Don't place a block
       inside the player.
    */

    const blockLeft =
        x * TILE;

    const blockTop =
        y * TILE;


    const overlap =
        player.x <
        blockLeft + TILE &&

        player.x +
        player.width >
        blockLeft &&

        player.y <
        blockTop + TILE &&

        player.y +
        player.height >
        blockTop;


    if (
        overlap
    ) {

        return;
    }


    world[y][x] =
        selectedBlock;
}


/* =====================================================
   FOOD
===================================================== */

function eatFood() {

    if (
        player.hunger >= 100
    ) {

        showMessage(
            "You aren't hungry!"
        );

        return;
    }


    if (
        player.apples > 0
    ) {

        player.apples--;

        player.hunger += 25;

        showMessage(
            "🍎 You ate an apple!"
        );

    } else if (
        player.meat > 0
    ) {

        player.meat--;

        player.hunger += 35;

        showMessage(
            "🥩 You ate meat!"
        );

    } else {

        showMessage(
            "You have no food!"
        );

        return;
    }


    player.hunger =
        Math.min(
            100,
            player.hunger
        );
}


/* =====================================================
   SLEEP
===================================================== */

function sleep() {

    const px =
        Math.floor(
            player.x / TILE
        );


    const py =
        Math.floor(
            player.y / TILE
        );


    let nearBed = false;


    for (
        let y = py - 3;
        y <= py + 3;
        y++
    ) {

        for (
            let x = px - 3;
            x <= px + 3;
            x++
        ) {

            if (
                x >= 0 &&
                x < WORLD_WIDTH &&
                y >= 0 &&
                y < WORLD_HEIGHT &&
                world[y][x] === BED
            ) {

                nearBed = true;
            }
        }
    }


    if (
        !nearBed
    ) {

        showMessage(
            "🛏️ Find a bed nearby!"
        );

        return;
    }


    player.sleeping =
        !player.sleeping;


    if (
        player.sleeping
    ) {

        player.health = 100;

        player.hunger = 100;

        showMessage(
            "🌙 Sleeping... Press F to wake."
        );

    } else {

        showMessage(
            "☀️ Good morning!"
        );
    }
}


/* =====================================================
   ANIMAL ATTACK
===================================================== */

function attackAnimal(
    animal
) {

    animal.health -= 10;


    if (
        animal.health <= 0
    ) {

        if (
            animal.type === "cow" ||
            animal.type === "pig" ||
            animal.type === "chicken"
        ) {

            player.meat += 2;

            showMessage(
                "🥩 You got meat!"
            );
        }


        const index =
            animals.indexOf(
                animal
            );


        if (
            index >= 0
        ) {

            animals.splice(
                index,
                1
            );
        }

    } else {

        showMessage(
            "You hit the " +
            animal.type
        );
    }
}


/* =====================================================
   CLICK ANIMALS
===================================================== */

canvas.addEventListener(
    "dblclick",
    e => {

        const x =
            e.clientX +
            cameraX;

        const y =
            e.clientY +
            cameraY;


        for (
            const animal of animals
        ) {

            if (
                x >
                animal.x - 20 &&

                x <
                animal.x + 20 &&

                y >
                animal.y - 10 &&

                y <
                animal.y + 40
            ) {

                attackAnimal(
                    animal
                );

                return;
            }
        }
    }
);


/* =====================================================
   SELECT BLOCK
===================================================== */

function selectBlock(
    number
) {

    const blocks = {

        1: GRASS,
        2: DIRT,
        3: STONE,
        4: WOOD,
        5: DIAMOND,
        6: BED

    };


    if (
        blocks[number]
    ) {

        selectedBlock =
            blocks[number];
    }


    document
        .querySelectorAll(".slot")
        .forEach(
            slot => {

                slot.classList.remove(
                    "selected"
                );

                if (
                    Number(
                        slot.dataset.slot
                    ) === number
                ) {

                    slot.classList.add(
                        "selected"
                    );
                }
            }
        );
}


/* =====================================================
   DRAW BLOCK
===================================================== */

function drawBlock(
    type,
    x,
    y
) {

    const px =
        x * TILE -
        cameraX;

    const py =
        y * TILE -
        cameraY;


    switch (type) {

        case GRASS:

            ctx.fillStyle =
                "#58b83d";

            ctx.fillRect(
                px,
                py,
                TILE,
                TILE
            );

            ctx.fillStyle =
                "#79502d";

            ctx.fillRect(
                px,
                py + 10,
                TILE,
                TILE - 10
            );

            break;


        case DIRT:

            ctx.fillStyle =
                "#79502d";

            ctx.fillRect(
                px,
                py,
                TILE,
                TILE
            );

            break;


        case STONE:

            ctx.fillStyle =
                "#777";

            ctx.fillRect(
                px,
                py,
                TILE,
                TILE
            );

            ctx.fillStyle =
                "#666";

            ctx.fillRect(
                px + 5,
                py + 6,
                5,
                5
            );

            ctx.fillRect(
                px + 19,
                py + 18,
                6,
                6
            );

            break;


        case WOOD:

            ctx.fillStyle =
                "#8b5a2b";

            ctx.fillRect(
                px,
                py,
                TILE,
                TILE
            );

            ctx.fillStyle =
                "#613d1d";

            ctx.fillRect(
                px + 7,
                py,
                4,
                TILE
            );

            ctx.fillRect(
                px + 21,
                py,
                4,
                TILE
            );

            break;


        case LEAVES:

            ctx.fillStyle =
                "#2f9d3a";

            ctx.fillRect(
                px,
                py,
                TILE,
                TILE
            );

            ctx.fillStyle =
                "#25802f";

            ctx.fillRect(
                px + 5,
                py + 5,
                7,
                7
            );

            break;


        case DIAMOND:

            ctx.fillStyle =
                "#444";

            ctx.fillRect(
                px,
                py,
                TILE,
                TILE
            );

            ctx.fillStyle =
                "#29e0e0";

            ctx.fillRect(
                px + 7,
                py + 7,
                8,
                8
            );

            ctx.fillRect(
                px + 16,
                py + 14,
                8,
                8
            );

            break;


        case COAL:

            ctx.fillStyle =
                "#555";

            ctx.fillRect(
                px,
                py,
                TILE,
                TILE
            );

            ctx.fillStyle =
                "#111";

            ctx.fillRect(
                px + 6,
                py + 6,
                8,
                8
            );

            ctx.fillRect(
                px + 18,
                py + 18,
                7,
                7
            );

            break;


        case BED:

            ctx.fillStyle =
                "#8b2020";

            ctx.fillRect(
                px,
                py + 10,
                TILE,
                TILE - 10
            );

            ctx.fillStyle =
                "#e63946";

            ctx.fillRect(
                px + 2,
                py + 3,
                TILE - 4,
                12
            );

            break;


        case SAND:

            ctx.fillStyle =
                "#d9c47c";

            ctx.fillRect(
                px,
                py,
                TILE,
                TILE
            );

            break;
    }


    /* Block outline */

    ctx.strokeStyle =
        "#0002";

    ctx.strokeRect(
        px,
        py,
        TILE,
        TILE
    );
}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer() {

    const x =
        player.x -
        cameraX;

    const y =
        player.y -
        cameraY;


    /* Body */

    ctx.fillStyle =
        "#2468d8";

    ctx.fillRect(
        x,
        y + 17,
        player.width,
        27
    );


    /* Head */

    ctx.fillStyle =
        "#c98b5b";

    ctx.fillRect(
        x + 2,
        y,
        20,
        20
    );


    /* Hair */

    ctx.fillStyle =
        "#4a2a16";

    ctx.fillRect(
        x + 2,
        y,
        20,
        6
    );


    /* Eye */

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        x + 16,
        y + 8,
        3,
        3
    );


    /* Legs */

    ctx.fillStyle =
        "#333";

    ctx.fillRect(
        x + 3,
        y + 40,
        7,
        6
    );

    ctx.fillRect(
        x + 14,
        y + 40,
        7,
        6
    );
}


/* =====================================================
   DRAW ANIMALS
===================================================== */

function drawAnimal(
    animal
) {

    const x =
        animal.x -
        cameraX;

    const y =
        animal.y -
        cameraY;


    let bodyColor =
        "#fff";


    if (
        animal.type === "cow"
    ) {

        bodyColor =
            "#76502f";
    }


    if (
        animal.type === "pig"
    ) {

        bodyColor =
            "#e99aaf";
    }


    if (
        animal.type === "chicken"
    ) {

        bodyColor =
            "#eee";
    }


    /* Body */

    ctx.fillStyle =
        bodyColor;

    ctx.fillRect(
        x,
        y + 12,
        35,
        22
    );


    /* Head */

    ctx.fillRect(
        x + 25,
        y + 3,
        18,
        18
    );


    /* Eye */

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        x + 37,
        y + 8,
        3,
        3
    );


    /* Legs */

    ctx.fillStyle =
        "#333";

    ctx.fillRect(
        x + 5,
        y + 30,
        6,
        10
    );

    ctx.fillRect(
        x + 24,
        y + 30,
        6,
        10
    );


    /* Chicken beak */

    if (
        animal.type === "chicken"
    ) {

        ctx.fillStyle =
            "#f2a900";

        ctx.fillRect(
            x + 42,
            y + 12,
            6,
            5
        );
    }
}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera() {

    cameraX =
        player.x -
        canvas.width / 2;


    cameraY =
        player.y -
        canvas.height / 2;


    cameraX =
        Math.max(
            0,
            Math.min(
                cameraX,
                WORLD_WIDTH * TILE -
                canvas.width
            )
        );


    cameraY =
        Math.max(
            0,
            Math.min(
                cameraY,
                WORLD_HEIGHT * TILE -
                canvas.height
            )
        );
}


/* =====================================================
   DRAW
===================================================== */

function draw() {

    /* Sky */

    ctx.fillStyle =
        player.sleeping
        ? "#10152f"
        : "#87ceeb";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Blocks */

    const startX =
        Math.floor(
            cameraX / TILE
        );


    const endX =
        Math.ceil(
            (cameraX +
            canvas.width) /
            TILE
        );


    const startY =
        Math.floor(
            cameraY / TILE
        );


    const endY =
        Math.ceil(
            (cameraY +
            canvas.height) /
            TILE
        );


    for (
        let y = startY;
        y < endY;
        y++
    ) {

        for (
            let x = startX;
            x < endX;
            x++
        ) {

            if (
                x < 0 ||
                x >= WORLD_WIDTH ||
                y < 0 ||
                y >= WORLD_HEIGHT
            ) {
                continue;
            }


            const block =
                world[y][x];


            if (
                block !== AIR
            ) {

                drawBlock(
                    block,
                    x,
                    y
                );
            }
        }
    }


    /* Animals */

    for (
        const animal of animals
    ) {

        drawAnimal(
            animal
        );
    }


    /* Player */

    drawPlayer();
}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    document.getElementById(
        "health"
    ).textContent =
        Math.max(
            0,
            Math.floor(
                player.health
            )
        );


    document.getElementById(
        "hunger"
    ).textContent =
        Math.floor(
            player.hunger
        );


    document.getElementById(
        "diamonds"
    ).textContent =
        player.diamonds;


    document.getElementById(
        "apples"
    ).textContent =
        player.apples;


    document.getElementById(
        "meat"
    ).textContent =
        player.meat;
}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer;


function showMessage(
    text
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                message.textContent =
                    "";

            },
            2000
        );
}


/* =====================================================
   RESPAWN
===================================================== */

function respawn() {

    showMessage(
        "💀 You died! Respawning..."
    );


    player.health = 100;

    player.hunger = 100;


    player.x =
        10 * TILE;


    player.y =
        20 * TILE;


    player.vx = 0;

    player.vy = 0;
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

    if (
        gameRunning
    ) {

        updatePlayer();

        updateAnimals();

        updateCamera();

        draw();

        updateHUD();
    }


    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    const name =
        document
            .getElementById(
                "worldName"
            )
            .value
            .trim();


    if (
        !name
    ) {

        document
            .getElementById(
                "error"
            )
            .textContent =
            "Enter a world name.";

        return;
    }


    document
        .getElementById(
            "worldTitle"
        )
        .textContent =
        name;


    document
        .getElementById(
            "menu"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "gameUI"
        )
        .style.display =
        "block";


    generateWorld();


    gameRunning = true;


    showMessage(
        "🌎 World created!"
    );
}

document

                        )

/* =====================================================
