<button id="jumpBtn">JUMP ⬆️</button>

<script>
  document.addEventListener("keydown", function(event) {
    if (event.code === "Space" || event.code === "ArrowUp") {
      event.preventDefault();

      // Make your character jump
      const player = document.querySelector("#player");

      if (player) {
        player.style.transition = "transform 0.3s ease";
        player.style.transform = "translateY(-100px)";

        setTimeout(() => {
          player.style.transform = "translateY(0)";
        }, 300);
      }
    }
  });

  document.getElementById("jumpBtn").onclick = function() {
    document.dispatchEvent(
      new KeyboardEvent("keydown", { code: "Space" })
    );
  };
</script>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Minecraft 2D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#222;color:white;font-family:monospace;text-align:center}
h2{margin:12px}
#hud{padding:8px;background:#333;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
#game{display:block;width:min(100%,960px);height:auto;margin:auto;background:#78c9f5;image-rendering:pixelated;touch-action:none}
#hotbar{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;padding:10px}
button{background:#454545;color:white;border:2px solid #777;padding:10px;cursor:pointer;font-weight:bold}
button.active{border:3px solid #ffe66b;background:#665a32}
#controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px}
#help{padding:10px;color:#ddd;font-size:13px}
</style>
</head>
<body>
<h2>⛏️ MINI MINECRAFT 2D</h2>
<div id="hud">
  <span id="hp">❤️ 10/10</span>
  <span id="count">Blocks: 0</span>
  <span id="status">Explore the world!</span>
</div>
<canvas id="game" width="960" height="540"></canvas>
<div id="hotbar"></div>
<div id="controls">
  <button id="left">◀ LEFT</button>
  <button id="jump">⬆ JUMP</button>
  <button id="right">RIGHT ▶</button>
  <button id="attack">⚔️ ATTACK</button>
  <button id="mine">⛏️ MINE</button>
  <button id="place">🧱 PLACE</button>
  <button id="reset">↻ NEW WORLD</button>
</div>
<div id="help">
  Keyboard: A/D or arrows to move · W/Space to jump · 1–7 select tools<br>
  Click a block to mine with the pickaxe. Select sword and click near an enemy to attack.<br>
  Right-click places blocks. On phones, use the buttons above.
</div>
<script>
(() => {
"use strict";
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height,T=24;
const NX=180,NY=40;
const names=["Sword","Pickaxe","Grass","Dirt","Stone","Wood","Leaves"];
const icons=["⚔️","⛏️","🟩","🟫","⬜","🪵","🌿"];
const colors=["","#64a84b","#8a5734","#858585","#9a6537","#348343"];
let map=[],ground=[],mobs=[],zombies=[],inv={1:25,2:30,3:30,4:10,5:10};
let choice=0,cam=0,health=10,iframes=0,dead=false,clock=0;
const p={x:80,y:0,w:17,h:34,vx:0,vy:0,face:1,ground:false};
const keys={};
const hotbar=document.getElementById("hotbar");
const hp=document.getElementById("hp");
const count=document.getElementById("count");
const status=document.getElementById("status");
let noteTime=0;

function note(s){status.textContent=s;noteTime=100}
function block(x,y){
 if(x<0||x>=NX||y>=NY)return 4;
 if(y<0)return 0;
 return map[y][x];
}
function makeWorld(){
 map=Array.from({length:NY},()=>Array(NX).fill(0));
 ground=[];
 mobs=[];zombies=[];
 let g=19;
 for(let x=0;x<NX;x++){
  if(Math.random()<.3)g+=Math.random()<.5?-1:1;
  g=Math.max(13,Math.min(25,g));ground[x]=g;
  for(let y=g;y<NY;y++)map[y][x]=y===g?1:y<g+4?2:3;
  if(x>12&&Math.random()<.055){
   for(let k=1;k<=3;k++)map[g-k][x]=5;
   for(let dx=-2;dx<=2;dx++)for(let dy=-5;dy<=-3;dy++){
    let xx=x+dx,yy=g+dy;
    if(xx>=0&&xx<NX&&yy>=0&&map[yy][xx]===0)map[yy][xx]=6;
   }
  }
 }
 for(let x=0;x<12;x++){
  ground[x]=19;
  for(let y=19;y<NY;y++)map[y][x]=y===19?1:y<23?2:3;
 }
 for(let i=0;i<18;i++){
  let x=rand(15,NX-2);
  mobs.push({x:x*T,y:ground[x]*T-20,w:22,h:20,hp:3,type:Math.random()<.5?"sheep":"pig",dir:Math.random()<.5?-1:1});
 }
 for(let i=0;i<12;i++){
  let x=rand(25,NX-2);
  zombies.push({x:x*T,y:ground[x]*T-30,w:20,h:30,hp:5,cd:0});
 }
 p.x=4*T;p.y=ground[4]*T-p.h;p.vx=0;p.vy=0;
 health=10;iframes=0;dead=false;inv={1:25,2:30,3:30,4:10,5:10};
 note("New world! Watch for zombies.");
 drawHotbar();
}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function drawHotbar(){
 hotbar.innerHTML="";
 names.forEach((n,i)=>{
  const b=document.createElement("button");
  b.className=i===choice?"active":"";
  b.textContent=(i+1)+" "+icons[i]+" "+n+(i>1?" ("+(inv[i-1]||0)+")":"");
  b.onclick=()=>{choice=i;drawHotbar()};
  hotbar.appendChild(b);
 });
}
function collides(x,y,w,h){
 let l=Math.floor(x/T),r=Math.floor((x+w-1)/T);
 let t=Math.floor(y/T),b=Math.floor((y+h-1)/T);
 for(let yy=t;yy<=b;yy++)for(let xx=l;xx<=r;xx++)if(block(xx,yy))return true;
 return false;
}
function move(){
 if(dead)return;
 let left=keys.a||keys.ArrowLeft||keys.left;
 let right=keys.d||keys.ArrowRight||keys.right;
 if(left){p.vx=-3;p.face=-1}
 else if(right){p.vx=3;p.face=1}
 else p.vx*=.7;
 if((keys.w||keys.ArrowUp||keys[" "]||keys.jump)&&p.ground){
  p.vy=-10;p.ground=false;
 }
 p.vy=Math.min(10,p.vy+.48);
 p.x+=p.vx;
 if(collides(p.x,p.y,p.w,p.h)){
  p.x-=p.vx;p.vx=0;
 }
 p.y+=p.vy;p.ground=false;
 if(collides(p.x,p.y,p.w,p.h)){
  if(p.vy>0)p.ground=true;
  p.y-=p.vy;p.vy=0;
 }
 p.x=Math.max(0,Math.min(NX*T-p.w,p.x));
 if(p.y>NY*T){hurt(3);p.y=ground[Math.floor(p.x/T)]*T-p.h}
}
function hurt(n){
 if(iframes>0||dead)return;
 health=Math.max(0,health-n);iframes=60;
 if(health<=0){dead=true;note("You died! Press R for a new world.")}
}
function updateMobs(){
 for(const a of mobs){
  if(Math.random()<.012)a.dir=Math.random()<.5?-1:1;
  const nx=a.x+a.dir*.5,tx=Math.floor((nx+(a.dir>0?a.w:0))/T);
  const gy=Math.min(NY-1,Math.floor((a.y+a.h+1)/T));
  if(!block(tx,gy)&&nx>0&&nx<NX*T-a.w)a.x=nx;
  a.y=ground[Math.max(0,Math.min(NX-1,Math.floor((a.x+a.w/2)/T)))]*T-a.h;
 }
 for(const z of zombies){
  const dx=p.x-z.x;
  if(Math.abs(dx)<T*13){
   let nx=z.x+Math.sign(dx)*.65;
   let tx=Math.floor((nx+(dx>0?z.w:0))/T);
   let gy=Math.min(NY-1,Math.floor((z.y+z.h+1)/T));
   if(!block(tx,gy))z.x=nx;
  }
  z.y=ground[Math.max(0,Math.min(NX-1,Math.floor((z.x+z.w/2)/T)))]*T-z.h;
  if(z.cd>0)z.cd--;
  if(overlap(p,z)&&z.cd===0){hurt(1);z.cd=55}
 }
 if(iframes>0)iframes--;
}
function overlap(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function targetFromEvent(e){
 const r=canvas.getBoundingClientRect();
 return {
  x:Math.floor((e.clientX-r.left)*W/r.width+cam),
  y:Math.floor((e.clientY-r.top)*H/r.height)
 };
}
function act(mode,x,y){
 if(dead)return;
 const tx=Math.floor(x/T),ty=Math.floor(y/T);
 if(tx<0||tx>=NX||ty<0||ty>=NY)return;
 const dist=Math.hypot(tx*T+T/2-(p.x+p.w/2),ty*T+T/2-(p.y+p.h/2));
 if(dist>T*5){note("Too far away!");return}
 const tool=names[choice];
 if(mode==="place"){
  const id=choice-1;
  if(choice<2){note("Select a block first.");return}
  if(block(tx,ty)!==0||(inv[id]||0)<=0)return;
  if(tx*T<p.x+p.w&&tx*T+T>p.x&&ty*T<p.y+p.h&&ty*T+T>p.y)return;
  map[ty][tx]=id;inv[id]--;drawHotbar();return;
 }
 if(tool==="Sword"){
  let all=[...mobs,...zombies],hit=null,best=T*3;
  for(const m of all){
   const d=Math.hypot(m.x+m.w/2-(p.x+p.w/2),m.y+m.h/2-(p.y+p.h/2));
   if(d<best){best=d;hit=m}
  }
  if(hit){
   hit.hp--;
   if(hit.hp<=0){mobs=mobs.filter(m=>m!==hit);zombies=zombies.filter(m=>m!==hit);note("Enemy defeated!")}
   else note("Hit! "+hit.hp+" health left");
  }else note("No enemy nearby!");
 }else if(tool==="Pickaxe"){
  if(!map[ty][tx])return;
  const id=map[ty][tx];map[ty][tx]=0;
  const slot=id===1?2:id;
  inv[slot]=(inv[slot]||0)+1;
  drawHotbar();note("Block mined!");
 }else note("Select the pickaxe to mine.");
}
function drawMob(m,zombie=false){
 let x=m.x-cam,y=m.y;
 if(zombie){
  ctx.fillStyle="#438b42";ctx.fillRect(x+3,y,14,12);
  ctx.fillStyle="#2777b8";ctx.fillRect(x+2,y+12,16,11);
  ctx.fillStyle="#34354a";ctx.fillRect(x+3,y+23,6,7);ctx.fillRect(x+12,y+23,6,7);
  ctx.fillStyle="white";ctx.fillRect(x+5,y+4,3,3);ctx.fillRect(x+13,y+4,3,3);
 }else{
  ctx.fillStyle=m.type==="pig"?"#ed9eae":"#f2eee1";
  ctx.fillRect(x,y+5,m.w,m.h-5);ctx.fillRect(x+14,y,10,12);
  ctx.fillStyle="#333";ctx.fillRect(x+20,y+4,2,2);
  ctx.fillStyle="#555";ctx.fillRect(x+3,y+16,4,5);ctx.fillRect(x+15,y+16,4,5);
 }
 ctx.fillStyle="#222";ctx.fillRect(x,y-6,m.w,4);
 ctx.fillStyle="#e33";ctx.fillRect(x,y-6,m.w*Math.max(0,m.hp/(zombie?5:3)),4);
}
function drawPlayer(){
 const x=p.x-cam,y=p.y;
 if(iframes>0&&Math.floor(iframes/5)%2===0)ctx.globalAlpha=.4;
 ctx.fillStyle="#e8b78b";ctx.fillRect(x+3,y,12,12);
 ctx.fillStyle="#5b3c29";ctx.fillRect(x+2,y,14,4);
 ctx.fillStyle="#3885cf";ctx.fillRect(x+1,y+12,15,13);
 ctx.fillStyle="#333d57";ctx.fillRect(x+2,y+25,6,9);ctx.fillRect(x+10,y+25,6,9);
 if(choice===0){
  ctx.strokeStyle="#dfe8f2";ctx.lineWidth=4;ctx.beginPath();
  ctx.moveTo(x+12,y+19);ctx.lineTo(x+22*p.face,y+8);ctx.stroke();
 }else if(choice===1){
  ctx.strokeStyle="#986438";ctx.lineWidth=3;ctx.beginPath();
  ctx.moveTo(x+12,y+20);ctx.lineTo(x+22,y+7);ctx.stroke();
  ctx.strokeStyle="#ccc";ctx.lineWidth=4;ctx.beginPath();
  ctx.moveTo(x+16,y+6);ctx.lineTo(x+25,y+4);ctx.stroke();
 }
 ctx.globalAlpha=1;
}
function draw(){
 cam=Math.max(0,Math.min(NX*T-W,p.x+p.w/2-W/2));
 ctx.fillStyle="#7cc9f5";ctx.fillRect(0,0,W,H);
 for(let y=0;y<NY;y++)for(let x=Math.floor(cam/T);x<Math.min(NX,Math.ceil((cam+W)/T));x++){
  const id=map[y][x];if(!id)continue;
  const xx=x*T-cam,yy=y*T;
  ctx.fillStyle=id===1?"#69ad43":id===2?"#89552f":id===3?"#858585":id===4?"#986337":"#348044";
  ctx.fillRect(xx,yy,T,T);
  if(id===1){ctx.fillStyle="#81ca50";ctx.fillRect(xx,yy,T,5)}
  ctx.strokeStyle="rgba(0,0,0,.1)";ctx.strokeRect(xx,yy,T,T);
 }
 mobs.forEach(m=>drawMob(m));
 zombies.forEach(z=>drawMob(z,true));
 drawPlayer();
 hp.textContent="❤️ "+health+"/10";
 count.textContent="🧱 Blocks: "+Object.values(inv).reduce((a,b)=>a+b,0);
 if(noteTime>0)noteTime--;
}
function frame(){
 if(!dead){move();updateMobs()}
 draw();
 requestAnimationFrame(frame);
}
window.addEventListener("keydown",e=>{
 let k=e.key.length===1?e.key.toLowerCase():e.key;
 if([" ","ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(k))e.preventDefault();
 keys[k]=true;
 if(k>="1"&&k<="7"){choice=Number(k)-1;drawHotbar()}
 if(k==="r")makeWorld();
 if(k==="f")act("attack",p.x+p.face*T*2,p.y+p.h/2);
 if(k==="e")act("mine",p.x+p.face*T*2,p.y+p.h/2);
});
window.addEventListener("keyup",e=>{
 keys[e.key.length===1?e.key.toLowerCase():e.key]=false;
});
window.addEventListener("blur",()=>Object.keys(keys).forEach(k=>keys[k]=false));
canvas.addEventListener("contextmenu",e=>e.preventDefault());
canvas.addEventListener("pointerdown",e=>{
 const t=targetFromEvent(e);
 act(e.button===2?"place":"attack",t.x,t.y);
});
function hold(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});
 const up=()=>keys[key]=false;
 el.addEventListener("pointerup",up);
 el.addEventListener("pointercancel",up);
 el.addEventListener("lostpointercapture",up);
}
hold("left","left");hold("right","right");hold("jump","jump");
document.getElementById("attack").onclick=()=>act("attack",p.x+p.face*T*2,p.y+p.h/2);
document.getElementById("mine").onclick=()=>{
 const x=Math.floor((p.x+p.w/2+p.face*T*2)/T);
 const y=Math.floor((p.y+p.h/2)/T);
 act("mine",x*T,y*T);
};
document.getElementById("place").onclick=()=>{
 const x=Math.floor((p.x+p.w/2+p.face*T*2)/T);
 const y=Math.floor((p.y+p.h/2)/T);
 act("place",x*T,y*T);
};
document.getElementById("reset").onclick=makeWorld;
makeWorld();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
