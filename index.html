<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Minecraft - Ultimate Fixed Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 15px;
            font-size: 24px;
            letter-spacing: 1px;
            color: #c6c6c6;
            text-shadow: 2px 2px #000000;
        }
        .game-container {
            position: relative;
            /* Extra width and height match TurboWarp container padding bounds */
            width: 486px;
            height: 412px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 4px solid #4a4a4a;
            border-radius: 4px;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Paper Minecraft</h1>

    <div class="game-container">
        <!-- Replaced with the valid project ID and added autoplay parameter -->
        <iframe src="https://turbowarp.org" 
                allowtransparency="true" 
                frameborder="0" 
                scrolling="no" 
                allowfullscreen>
        </iframe>
    </div>

    <div class="controls-hint">
        The game will load and start automatically. Enjoy!
    </div>

</body>
</html>
