<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft 2.0</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        overflow: hidden;
        background: #87ceeb;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
        image-rendering: pixelated;
    }

    #ui {
        position: fixed;
        top: 15px;
        left: 15px;
        color: white;
        background: rgba(0,0,0,.55);
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 15px;
        z-index: 10;
    }

    #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 20px;
        height: 20px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 5;
    }

    #crosshair::before,
    #crosshair::after {
        content: "";
        position: absolute;
        background: white;
        box-shadow: 0 0 2px black;
    }

    #crosshair::before {
        width: 2px;
        height: 20px;
        left: 9px;
    }

    #crosshair::after {
        width: 20px;
        height: 2px;
        top: 9px;
    }
</style>
</head>

<body>

<div id="ui">
    <b>Minecraft 2.0</b><br>
    A / D = Move<br>
    SPACE = Jump<br>
    Left Click = Break Block<br>
    Right Click = Place Block
</div>

<div id="crosshair"></div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// =============================
// WORLD SETTINGS
// =============================

const TILE = 40;

const WORLD_WIDTH = 100;
const WORLD_HEIGHT = 25;

const world = [];

// Block types
const AIR = 0;
const GRASS = 1;
const DIRT = 2;
const STONE = 3;
const WOOD = 4;

// =============================
// GENERATE WORLD
// =============================

for (let y = 0; y < WORLD_HEIGHT; y++) {
    world[y] = [];

    for (let x = 0; x < WORLD_WIDTH; x++) {
        world[y][x] = AIR;
    }
}

// Ground height
const groundHeights = [];

for (let x = 0; x < WORLD_WIDTH; x++) {

    // Small hills
    const height =
        12 +
        Math.floor(Math.sin(x * 0.15) * 2) +
        Math.floor(Math.sin(x * 0.05) * 2);

    groundHeights[x] = height;

    for (let y = height; y < WORLD_HEIGHT; y++) {

        if (y === height) {
            world[y][x] = GRASS;
        }
        else if (y < height + 4) {
            world[y][x] = DIRT;
        }
        else {
            world[y][x] = STONE;
        }
    }
}

// =============================
// PLAYER
// =============================

const player = {
    x: 10 * TILE,
    y: 5 * TILE,

    width: 28,
    height: 38,

    vx: 0,
    vy: 0,

    speed: 5,
    jumpPower: 12,

    onGround: false
};

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        e.preventDefault();

        if (player.onGround) {
            player.vy = -player.jumpPower;
            player.onGround = false;
        }
    }
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

// =============================
// CAMERA
// =============================

let cameraX = 0;
let cameraY = 0;

// =============================
// COLLISION
// =============================

function isSolid(tx, ty) {

    if (tx < 0 || tx >= WORLD_WIDTH)
        return true;

    if (ty < 0)
        return false;

    if (ty >= WORLD_HEIGHT)
        return true;

    return world[ty][tx] !== AIR;
}


function collisionRect(x, y, width, height) {

    const left = Math.floor(x / TILE);
    const right = Math.floor((x + width - 0.001) / TILE);

    const top = Math.floor(y / TILE);
    const bottom = Math.floor((y + height - 0.001) / TILE);

    for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {

            if (isSolid(tx, ty)) {
                return true;
            }
        }
    }

    return false;
}

// =============================
// PHYSICS
// =============================

function updatePlayer() {

    // Movement
    player.vx = 0;

    if (keys["a"] || keys["arrowleft"]) {
        player.vx = -player.speed;
    }

    if (keys["d"] || keys["arrowright"]) {
        player.vx = player.speed;
    }

    // Gravity
    player.vy += 0.55;

    // Maximum falling speed
    if (player.vy > 15) {
        player.vy = 15;
    }

    // ---------------------------------
    // HORIZONTAL COLLISION
    // ---------------------------------

    player.x += player.vx;

    if (collisionRect(
        player.x,
        player.y,
        player.width,
        player.height
    )) {

        // Move back until we're outside the block
        while (collisionRect(
            player.x,
            player.y,
            player.width,
            player.height
        )) {
            player.x -= Math.sign(player.vx || 1);
        }

        player.vx = 0;
    }

    // ---------------------------------
    // VERTICAL COLLISION
    // ---------------------------------

    player.onGround = false;

    player.y += player.vy;

    if (collisionRect(
        player.x,
        player.y,
        player.width,
        player.height
    )) {

        if (player.vy > 0) {

            // Falling down
            while (collisionRect(
                player.x,
                player.y,
                player.width,
                player.height
            )) {
                player.y -= 1;
            }

            player.onGround = true;
        }
        else if (player.vy < 0) {

            // Hitting ceiling
            while (collisionRect(
                player.x,
                player.y,
                player.width,
                player.height
            )) {
                player.y += 1;
            }
        }

        player.vy = 0;
    }

    // Extra safety:
    // Never allow the player to fall below the world.
    if (player.y > WORLD_HEIGHT * TILE - player.height) {

        player.y =
            WORLD_HEIGHT * TILE -
            player.height;

        player.vy = 0;
        player.onGround = true;
    }

    // Camera follows player
    cameraX =
        player.x -
        canvas.width / 2 +
        player.width / 2;

    cameraY =
        player.y -
        canvas.height / 2;

    cameraX = Math.max(
        0,
        Math.min(
            cameraX,
            WORLD_WIDTH * TILE - canvas.width
        )
    );

    cameraY = Math.max(
        0,
        Math.min(
            cameraY,
            WORLD_HEIGHT * TILE - canvas.height
        )
    );
}

// =============================
// DRAW BLOCK
// =============================

function drawBlock(type, x, y) {

    const px = x * TILE - cameraX;
    const py = y * TILE - cameraY;

    if (type === GRASS) {

        ctx.fillStyle = "#5dbb3f";
        ctx.fillRect(px, py, TILE, TILE);

        ctx.fillStyle = "#79502c";
        ctx.fillRect(px, py + 10, TILE, TILE - 10);
    }

    else if (type === DIRT) {

        ctx.fillStyle = "#79502c";
        ctx.fillRect(px, py, TILE, TILE);
    }

    else if (type === STONE) {

        ctx.fillStyle = "#777";
        ctx.fillRect(px, py, TILE, TILE);

        // Stone pixels
        ctx.fillStyle = "#666";

        for (let i = 0; i < 5; i++) {
            const sx = px + Math.random() * TILE;
            const sy = py + Math.random() * TILE;

            ctx.fillRect(
                Math.floor(sx / 5) * 5,
                Math.floor(sy / 5) * 5,
                5,
                5
            );
        }
    }

    else if (type === WOOD) {

        ctx.fillStyle = "#8b5a2b";
        ctx.fillRect(px, py, TILE, TILE);

        ctx.fillStyle = "#603b1d";

        for (let i = 0; i < 4; i++) {
            ctx.fillRect(
                px + 8 + i * 9,
                py,
                3,
                TILE
            );
        }
    }

    // Block outline
    ctx.strokeStyle = "rgba(0,0,0,.15)";
    ctx.strokeRect(px, py, TILE, TILE);
}

// =============================
// DRAW WORLD
// =============================

function drawWorld() {

    // Sky
    ctx.fillStyle = "#87ceeb";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Sun
    ctx.fillStyle = "#fff176";

    ctx.beginPath();
    ctx.arc(
        canvas.width - 120,
        100,
        50,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Blocks
    const startX =
        Math.max(
            0,
            Math.floor(cameraX / TILE) - 1
        );

    const endX =
        Math.min(
            WORLD_WIDTH,
            Math.ceil(
                (cameraX + canvas.width) / TILE
            ) + 1
        );

    const startY =
        Math.max(
            0,
            Math.floor(cameraY / TILE) - 1
        );

    const endY =
        Math.min(
            WORLD_HEIGHT,
            Math.ceil(
                (cameraY + canvas.height) / TILE
            ) + 1
        );

    for (let y = startY; y < endY; y++) {

        for (let x = startX; x < endX; x++) {

            const block = world[y][x];

            if (block !== AIR) {
                drawBlock(block, x, y);
            }
        }
    }
}

// =============================
// DRAW PLAYER
// =============================

function drawPlayer() {

    const x = player.x - cameraX;
    const y = player.y - cameraY;

    // Body
    ctx.fillStyle = "#2196f3";
    ctx.fillRect(
        x,
        y + 14,
        player.width,
        player.height - 14
    );

    // Head
    ctx.fillStyle = "#f0b27a";
    ctx.fillRect(
        x,
        y,
        player.width,
        18
    );

    // Hair
    ctx.fillStyle = "#4e342e";
    ctx.fillRect(
        x,
        y,
        player.width,
        6
    );

    // Eyes
    ctx.fillStyle = "#222";

    ctx.fillRect(
        x + 6,
        y + 8,
        4,
        4
    );

    ctx.fillRect(
        x + 18,
        y + 8,
        4,
        4
    );
}

// =============================
// BLOCK EDITING
// =============================

canvas.addEventListener("contextmenu", e => {
    e.preventDefault();
});

canvas.addEventListener("mousedown", e => {

    const rect = canvas.getBoundingClientRect();

    const mouseX =
        e.clientX -
        rect.left +
        cameraX;

    const mouseY =
        e.clientY -
        rect.top +
        cameraY;

    const tx = Math.floor(mouseX / TILE);
    const ty = Math.floor(mouseY / TILE);

    if (
        tx < 0 ||
        tx >= WORLD_WIDTH ||
        ty < 0 ||
        ty >= WORLD_HEIGHT
    ) {
        return;
    }

    // Left click = break
    if (e.button === 0) {

        world[ty][tx] = AIR;
    }

    // Right click = place
    if (e.button === 2) {

        // Don't place a block inside player
        const bx = tx * TILE;
        const by = ty * TILE;

        const overlapsPlayer =
            bx < player.x + player.width &&
            bx + TILE > player.x &&
            by < player.y + player.height &&
            by + TILE > player.y;

        if (!overlapsPlayer) {
            world[ty][tx] = DIRT;
        }
    }
});

// =============================
// GAME LOOP
// =============================

function gameLoop() {

    updatePlayer();

    drawWorld();

    drawPlayer();

    requestAnimationFrame(gameLoop);
}

// =============================
// RESIZE
// =============================

window.addEventListener("resize", () => {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

// Start game
gameLoop();

</script>

</body>
</html>
